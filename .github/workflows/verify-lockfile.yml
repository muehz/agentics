# Fails when .github/workflows/actions.lock is out of sync with the workflows,
# a locked pin no longer verifies upstream, or any workflow outside
# release.lock.yml's reviewed-parent verifier uses a `./` local action.

name: Verify Actions Lockfile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.ref) || format('run-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  verify:
    name: Check / Actions lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - name: Install pinned gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify actions.lock and local-action allowlist
        run: node .github/tools/src/scripts/ci-actions-lock.ts
