name: Mutation

# Called by validate.yml on manual dispatch only, never run on its own. Grouping these jobs means every other run
# shows one skipped Mutation entry instead of two.

on:
  workflow_call:
    inputs:
      fresh:
        description: Ignore the saved Stryker results and test every mutant
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Report-only: no job here fails because a mutant survived. The Stryker legs
  # reuse the last run's results from a cache, and GitHub removes a cache that no run has read for seven days,
  # so a run after a long gap starts from scratch.
  mutation-full:
    name: Mutate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      GREMLINS_VERSION: v0.6.0
      # The mutated suites must not pass by skipping a test whose interpreter is missing.
      AGX_REQUIRED_INTERPRETERS: sh,bash,pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: gremlins, target: ./internal/shellwords }
          - { tool: gremlins, target: ./internal/commandguard }
          - { tool: gremlins, target: ./internal/secretsguard }
          - { tool: gremlins, target: ./cmd/hook }
          - { tool: gremlins, target: rest }
          # A leg saves its results only when it finishes, so each Stryker leg has to fit the time limit on a
          # first run with nothing saved. The large folders are split for that reason.
          - { tool: stryker, target: .github/tools/src/conformance }
          - { tool: stryker, target: .github/tools/src/release/commands }
          - { tool: stryker, target: release-rest }
          - { tool: stryker, target: .github/tools/src/peer }
          - { tool: stryker, target: tools-rest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name this entry for the merged summary
        env:
          TOOL: ${{ matrix.tool }}
          TARGET: ${{ matrix.target }}
        run: mkdir -p reports/mutation && printf '%s %s\n' "$TOOL" "$TARGET" > reports/mutation/entry.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1

      # gremlins needs Go, and some tools tests that Stryker runs call the go command.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hooks/go/go.mod
          cache-dependency-path: hooks/go/go.mod

      - name: Install npm 12
        run: npm install --global --ignore-scripts npm@12.2.1

      - name: Install the pinned Stryker toolchain
        if: matrix.tool == 'stryker'
        run: npm ci --ignore-scripts

      # Stryker reuses the saved result of a mutant whose file and covering test files are unchanged, so a run tests
      # only what changed since the last one. The key ends in the run id, so every finished leg saves a new cache
      # and the next run restores the newest one for its target.
      - name: Restore the last run's Stryker results
        if: matrix.tool == 'stryker'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation-incremental
          key: stryker-incremental-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: stryker-incremental-${{ matrix.target }}-

      # Stryker does not see a change in a file that the mutated files or their tests only depend on. A manual run
      # with `fresh` set tests every mutant again.
      - name: Mutate one TypeScript area
        if: matrix.tool == 'stryker'
        env:
          TARGET: ${{ matrix.target }}
          FRESH: ${{ inputs.fresh && '--force' || '' }}
        # shellcheck disable=SC2086 # FRESH is one flag or nothing
        run: npm run test:mutation -- --area "$TARGET" --incremental reports/mutation-incremental/stryker.json $FRESH

      - name: Install the pinned gremlins
        if: matrix.tool == 'gremlins'
        run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"

      - name: Mutate hooks/go packages
        if: matrix.tool == 'gremlins'
        env:
          TARGET: ${{ matrix.target }}
        run: node .github/tools/src/scripts/ci-mutation-hooks.ts

      - name: Upload the raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore

  mutation-summary:
    name: Summary
    needs: [mutation-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: reports/all

      - name: Write the merged survivor report
        run: node .github/tools/src/scripts/mutation-report.ts --dir reports/all --full --expect 10 >> "$GITHUB_STEP_SUMMARY"
