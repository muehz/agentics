name: Coverage

# Called by validate.yml, never run on its own. Grouping these jobs in one reusable workflow means a pull request,
# which never runs them, shows one skipped Coverage entry instead of five. Coverage is reporting, not a gate.

on:
  workflow_call:
    inputs:
      cache:
        description: The cache input of a manual validate run; empty on other events
        type: string
        default: ""
      go-suite-result:
        description: The result of validate.yml's go-suite job
        type: string
        required: true
      shards:
        description: The scope job's Go shard selection
        type: string
        default: ""
      ts-coverage:
        description: The scope job's TypeScript coverage path match on a push
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Merges the Ubuntu shards' profiles into one Go report. It runs repository
  # code with a read-only token; the job that can write code-quality only uploads the
  # finished artifact. Neither job is in validation-summary: coverage is
  # reporting, not a gate.
  #
  # go-suite is advisory off pull requests: a macOS or Windows leg that fails
  # makes the whole matrix fail. The report needs only the Ubuntu profiles, so
  # it runs unless go-suite was skipped or cancelled, or a pull request ran
  # only some of the shards (a partial set would understate coverage). The
  # profile check below turns a missing Ubuntu profile into a named failure.
  coverage-report:
    name: Go report
    runs-on: ubuntu-latest
    if: ${{ inputs.go-suite-result != 'skipped' && (inputs.shards == '' || inputs.shards == '["hooks"]') }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      # The default checkout, like go-suite's: the profiles were measured on
      # that tree, and the converter resolves their files against it.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: hooks/go/go.mod
          cache: ${{ inputs.cache != 'cold' }}
          cache-dependency-path: hooks/go/go.mod

      - name: Download shard coverage profiles
        uses: actions/download-artifact@v8.0.2
        with:
          name: go-coverage-profile-hooks
          path: ${{ runner.temp }}/profiles/go-coverage-profile-hooks

      # A report built from some shards would understate coverage, so every
      # shard of go-suite's matrix must have delivered its profile. The shard
      # arguments must equal that matrix; ci-workflow.test.ts checks that they do.
      - name: Require every shard profile
        run: node .github/tools/src/scripts/ci-coverage.ts require-profiles hooks

      # Retain the module profile under the name used by the converter below.
      - name: Merge shard profiles per module
        run: node .github/tools/src/scripts/ci-coverage.ts merge-profiles

      - name: Report module coverage totals
        run: node .github/tools/src/scripts/ci-coverage.ts totals

      - name: Convert profiles to Cobertura XML
        run: |
          node .github/tools/src/coverage/cli.ts goprofile --source-root . --module hooks/go --profile coverage-hooks.out --out cobertura.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report-go
          path: |
            cobertura.xml
            coverage-hooks.out
            coverage-hooks.txt

  coverage-upload:
    name: Go upload
    runs-on: ubuntu-latest
    needs: [coverage-report]
    if: ${{ !cancelled() && needs.coverage-report.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-report-go

      # A manual feature-branch run has no PR upload context, and the provider
      # accepts a branch-only upload only on the repository's default branch.
      - name: Select supported coverage upload context
        id: context
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Coverage artifact retained; manual non-default refs have no supported code-quality upload context."
          else
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-code-coverage@v1.4.4
        if: steps.context.outputs.should_upload == 'true'
        with:
          file: cobertura.xml
          language: Go
          label: code-coverage-agent

  # Instrumented TypeScript tests. A push to main runs them only when it touches
  # a path the scope job's coverage check lists; the schedule and manual
  # dispatch always run them.
  ts-coverage:
    name: TypeScript
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || inputs.ts-coverage != 'false' }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { workspace: tools, shard: 1 }
    env:
      WORKSPACE: ${{ matrix.workspace }}
      TEST_SHARD: ${{ matrix.shard }}
      # A test whose interpreter is listed fails instead of skipping when it is missing.
      AGX_REQUIRED_INTERPRETERS: sh,bash,pwsh
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - name: Install npm 12
        run: npm install --global --ignore-scripts npm@12.2.1

      - name: Install the pinned TypeScript toolchain
        run: npm ci --ignore-scripts

      - name: Install the pinned release tooling
        run: npm ci --ignore-scripts --prefix .github/release

      - name: Set up the TypeScript fixture toolchain
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: hooks/go/go.mod
          cache: ${{ inputs.cache != 'cold' }}
          cache-dependency-path: hooks/go/go.mod

      - name: Run the instrumented test shard
        run: node .github/tools/src/scripts/ci-test-shard.ts "coverage-$WORKSPACE" "$TEST_SHARD" 1

      - name: Upload the shard LCOV report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ts-coverage-lcov-${{ matrix.workspace }}-${{ matrix.shard }}
          path: .github/${{ matrix.workspace }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  ts-coverage-report:
    name: TypeScript report
    runs-on: ubuntu-latest
    needs: [ts-coverage]
    if: ${{ !cancelled() && needs.ts-coverage.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - name: Download shard LCOV reports
        uses: actions/download-artifact@v8.0.2
        with:
          name: ts-coverage-lcov-tools-1
          path: ${{ runner.temp }}/lcov/ts-coverage-lcov-tools-1

      # Every shard of the ts-coverage matrix must have delivered its report. The shard arguments must equal that
      # matrix; ci-workflow.test.ts checks that they do.
      - name: Combine complete TypeScript coverage
        run: node .github/tools/src/scripts/ci-coverage.ts combine-ts tools-1

      - name: Upload TypeScript coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report-typescript
          path: cobertura-typescript.xml
          if-no-files-found: error

  # The write token sees only the finished artifact and never repository code.
  ts-coverage-upload:
    name: TypeScript upload
    runs-on: ubuntu-latest
    needs: [ts-coverage-report]
    if: ${{ !cancelled() && needs.ts-coverage-report.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-report-typescript

      - name: Select supported coverage upload context
        id: context
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Coverage artifact retained; manual non-default refs have no supported code-quality upload context."
          else
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-code-coverage@v1.4.4
        if: steps.context.outputs.should_upload == 'true'
        with:
          file: cobertura-typescript.xml
          language: TypeScript
          label: code-coverage-agent-typescript
